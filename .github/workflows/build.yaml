name: "Build"

on:
  push: 
    branches: 
      - main   
  pull_request:
    types:
       - opened
       - synchronize
       - reopened 
  workflow_dispatch:

jobs: 
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
 
      - name: Restore packages
        working-directory: ${{ github.workspace }}/src/server/Ayllu
        run: dotnet restore Ayllu.csproj

      - name: Build
        working-directory: ${{ github.workspace }}/src/server/Ayllu
        run: dotnet build Ayllu.csproj --configuration Release --framework net10.0 --no-restore


  
   


  