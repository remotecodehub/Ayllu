name: "Build"

on:
  push: 
    branches: 
      - main   
  pull_request:
    types:
       - opened
       - synchronize
       - reopened 
  workflow_dispatch:

jobs: 
  client:
    name: "Build (${{ matrix.target.framework }}${{ matrix.target.runtime && format(' - {0}', matrix.target.runtime) }})"
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - { os: windows-latest, framework: net10.0-android }
          - { os: macos-26, framework: net10.0-ios, runtime: iossimulator-arm64 }
          - { os: macos-26, framework: net10.0-maccatalyst, runtime: maccatalyst-arm64 }
          - { os: windows-latest, framework: net10.0-windows10.0.19041.0  }
      fail-fast: false
     
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          
      - name: Instalar workloads MAUI
        run: dotnet workload install maui

      - name: Setup Java JDK 
        if: matrix.target.framework == 'net10.0-android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Xcode 26.6
        if: matrix.target.os == 'macos-26' 
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore packages
        working-directory: ${{ github.workspace }}/src/client/Ayllu/
        run: dotnet restore Ayllu.csproj  ${{ matrix.target.runtime && format('--runtime {0}', matrix.target.runtime) }} 

      - name: Build
        working-directory: ${{ github.workspace }}/src/client/Ayllu/
        run: dotnet build Ayllu.csproj --configuration Release --framework ${{ matrix.target.framework }} ${{ matrix.target.runtime && format('--runtime {0}', matrix.target.runtime) }} --no-restore

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
 
      - name: Restore packages
        working-directory: ${{ github.workspace }}/src/server/Ayllu
        run: dotnet restore Ayllu.csproj

      - name: Build
        working-directory: ${{ github.workspace }}/src/server/Ayllu
        run: dotnet build Ayllu.csproj --configuration Release --framework net10.0 --no-restore


  
   


  